<!doctype html>
<html><head><meta charset="utf-8"><title>Quick Ask</title>
<style>
html,body{margin:0;height:100%;background:#141414;overflow:hidden}
body{display:flex;align-items:center;font:16px "Segoe UI Variable","Segoe UI",sans-serif;color:#f5f5f7}
.wrap{display:flex;align-items:center;gap:12px;width:100%;padding:0 18px;box-sizing:border-box;height:100%;
  border:1px solid rgba(255,255,255,.12);border-radius:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#19b3a6;flex:none;box-shadow:0 0 12px #19b3a6}
input{flex:1;background:transparent;border:0;outline:0;color:inherit;font:inherit;font-size:17px}
input::placeholder{color:#7b8499}
kbd{font:12px Consolas,monospace;color:#7b8499;border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:2px 6px}
</style></head>
<body><div class="wrap"><span class="dot"></span>
<input id="q" placeholder="Ask Hark anything…" autocomplete="off" spellcheck="true" autofocus>
<kbd>Enter</kbd></div>
<script>
const q = document.getElementById("q");
const invoke = (c, a) => window.__TAURI_INTERNALS__.invoke(c, a || {});
window.__quickFocus = () => { q.focus(); q.select(); };
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = q.value.trim();
    if (text) { invoke("quick_submit", { text }); q.value = ""; }
  } else if (e.key === "Escape") {
    q.value = ""; invoke("quick_hide");
  }
});
window.addEventListener("focus", () => q.focus());
</script></body></html>
